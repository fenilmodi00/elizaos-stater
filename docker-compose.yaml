services:
    eliza:
        command: ["pnpm", "start", "--character=./characters/eliza.character.json"]
        build:
            context: .
            dockerfile: Dockerfile
        stdin_open: true
        tty: true
        volumes:
            - ./data:/app/data
        environment:
            -DEEPSEEK_API_KEY=sk-Eqt_Wlqd-aHcHB_vWUo7wg
            - DEEPSEEK_API_URL=https://chatapi.akash.network/api/v1
            - SMALL_DEEPSEEK_MODEL=DeepSeek-R1
            - MEDIUM_DEEPSEEK_MODEL=DeepSeek-R1-Distill-Llama-70B
            - LARGE_DEEPSEEK_MODEL=DeepSeek-R1-Distill-Llama-8B
            - SERVER_PORT=3000
        ports:
            - "3000:3000"
        restart: always
